<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>WORKS</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Euphemia UCAS', sans-serif;
            background-color: #ffffff;
            color: #654321;
            overflow: hidden; 
        }

        .cv-main-container {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            padding: 60px 40px 20px 40px;
            display: flex;
            gap: 40px; 
            position: relative;
        }

        /* [1구역] 맨 왼쪽 */
        .photo-zone {
            width: 155px; 
            flex-shrink: 0;
            margin-top: 43px;
            position: relative;
            z-index: 500;
            background-color: transparent;
        }

        .works-main-tab {
            font-size: 18px; 
            font-weight: 1100;
            color: #654321;
            text-decoration: none; 
            border: 1px solid #654321; 
            padding: 6px 12px; 
            margin-bottom: 25px; 
            display: inline-block; 
            cursor: pointer;
            transition: color 0.2s ease;
            user-select: none;
            box-sizing: border-box;
            width: 100%; 
            text-align: center;
            background-color: transparent;
        }
        .works-main-tab:hover { color: #0022ff; }
        .works-main-tab.active-tab { color: #0022ff; }

        /* [2구역] 가운데 */
        .info-zone {
            width: 250px; 
            flex-shrink: 0;
            padding-top: 43px; 
            position: relative;
            z-index: 90;
            background-color: transparent;
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease;
            transform-origin: left top;
            display: none; 
        }

        .content-section { background-color: transparent; display: none; }
        .content-section.active { display: block; }

        .works-year-title {
            font-size: 19px;
            font-weight: bold;
            color: #654321;
            margin-top: 35px;
            margin-bottom: 12px;
            letter-spacing: -1px;
            line-height: 1.5; 
        }
        
        .content-section > .works-year-title:first-child {
            margin-top: 0;
            padding-top: 2px; 
        }

        .works-text-link {
            display: block;
            font-size: 16px;
            font-weight: 400; 
            color: #654321;
            letter-spacing: -1px; 
            text-decoration: none; 
            padding: 6px 0; 
            user-select: none;
            background-color: transparent;
            cursor: pointer;
            transition: color 0.2s ease;
        }
        .works-text-link:hover { color: #0022ff; }
        .works-text-link.viewing { color: #0022ff; font-weight: 400 !important; }

        /* [3구역] 사진 및 슬라이드 영역 */
        .artwork-display-zone {
            flex-grow: 1;
            margin-top: 70px; 
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            display: none; 
        }

        .artwork-display-zone.multi-mode,
        .artwork-display-zone.single-mode {
            position: absolute;
            left: 0;
            top: 60px;
            width: 100%;
            height: calc(100% - 80px);
            margin-top: 65px;
        }

        .photo-slider-window {
            width: 100%;
            height: 100%;
            position: relative;
            scrollbar-width: none; 
            display: flex;
            flex-direction: column; 
            box-sizing: border-box;
            padding-left: 475px; 
        }
        .photo-slider-window::-webkit-scrollbar { display: none; }

        /* 다중 모드: 가로 스크롤만 작동 */
        .artwork-display-zone.multi-mode .photo-slider-window { 
            overflow-x: auto; 
            overflow-y: hidden;
            cursor: grab; 
        }
        .artwork-display-zone.multi-mode .photo-slider-window:active { cursor: grabbing; }
